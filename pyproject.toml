[tool.poetry]
name = "xberg-ocr"
version = "0.1.0"
description = "Lightweight OCR server using FastAPI and xberg VLMOCR with Ollama"
authors = ["Michael Wittmann <michael.wittmann@tum.de>"]
readme = "README.md"
license = "MIT"
packages = [{include = "xberg_ocr", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
python-multipart = "^0.0.32"
xberg = "^1.0.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
pypdf = "^3.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
mkdocs-material = "9.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
